# supervisor program: dedicated Frappe SocketIO node for the INDTOOLS site.
#
# Frappe serves realtime (realtime./socket.io) from <bench>/apps/frappe/socketio.js.
# Give each bench/site its own port (default 9000; this template uses 9001
# for our bench so it does not clash with the webshop/erpnext bench default).
#
# Install: put in /etc/supervisor/conf.d/ and:
#   supervisorctl reread && supervisorctl update

[program:indtools-socketio]
command=/usr/bin/node /path/to/bench/apps/frappe/socketio.js
directory=/path/to/bench/sites
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=<www-user>
environment=FRAPPE_SOCKETIO_CLIENT_PORT="9001",FRAPPE_SOCKETIO_PORT="9001"
stderr_logfile=/var/log/indtools-socketio.err.log
stdout_logfile=/var/log/indtools-socketio.out.log
redirect_stderr=true

# FRAPPE_SOCKETIO_PORT  -> the socket.io broker/nsp port clients connect to
# FRAPPE_SOCKETIO_CLIENT_PORT -> port used in frappe.realtime URLs
# The PWA connects to `${wss}://<host>/socket.io/<SITE>` (namespace = site name),
# so reverse-proxy /socket.io to this port with X-Frappe-Site-Name=<SITE>.
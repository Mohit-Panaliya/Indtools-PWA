# nginx site block for the INDTOOLS PWA behind a reverse proxy.
#
# Serves the Frappe site (gunicorn on 127.0.0.1:8001) plus:
#   - static /assets + /files directly from the bench sites dir
#   - /socket.io -> dedicated SocketIO node (default 127.0.0.1:9001)
#   - Host-based: the PWA route '/' is served as-is; on the canonical
#     domain (indtools.in / www.indtools.in) the root URL is rewired
#     internally to the Frappe website route "/indtools" (the URL stays '/').
#
# Adjust <SITE>, listener port, socketio port and upstreams for your box.
# Place at /etc/nginx/sites-enabled/<site>.conf and `nginx -t && systemctl reload nginx`.

upstream indtools-upstream {
    server 127.0.0.1:8001 fail_timeout=0;
}

upstream indtools-socketio {
    server 127.0.0.1:9001 fail_timeout=0;
}

server {
    listen 8002;
    server_name <your-canonical-domain> www.<your-canonical-domain> <other-domains>;

    root /path/to/bench/sites;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # '/' on the main store domain -> serve the PWA at the root URL
    # (the browser URL stays '/'; upstream sees /indtools).
    location = / {
        rewrite ^ /indtools last;
    }

    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
        access_log off;
    }

    location /files/ {
        alias /path/to/bench/sites/<SITE>/public/files/;
        add_header Cache-Control "max-age=31536000";
        access_log off;
    }

    location /files {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
        access_log off;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name <SITE>;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_pass http://indtools-socketio;
    }

    location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~* ^/files/.*.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /<SITE>/public/$uri @indtools;
        }

        try_files /<SITE>/public/$uri @indtools;
    }

    location @indtools {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name <SITE>;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://indtools-upstream;
    }

    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 50m;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;

    gzip on;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/font-woff
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;
}
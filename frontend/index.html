<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>INDTOOLS - Industrial Tools & Fasteners</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="INDTOOLS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a14" />
    <link rel="icon" type="image/png" sizes="196x196" href="/assets/indtools_pwa/manifest/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/assets/indtools_pwa/manifest/apple-touch-icon.png" />
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = "{{ csrf_token }}"
      window.site_name = '{{ site_name }}'
      if (!window.frappe) window.frappe = {}
      frappe.boot = {{ boot }}
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
